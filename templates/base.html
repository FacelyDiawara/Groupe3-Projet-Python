<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Hôpital Central{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
      // Immediate authentication check before page render
      (function() {
          const role = localStorage.getItem('userRole');
          const path = window.location.pathname;
          if (!role && path !== '/login') {
              window.location.href = "/login";
          }
      })();
    </script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="nav-buttons">
        <a href="/" class="nav-btn" data-page="home">ACCUEIL</a>
        <a href="/appointments" class="nav-btn" data-page="appointments">GESTION DES PATIENTS</a>
        <a href="/users" class="nav-btn" data-page="users">UTILISATEUR</a>
        <a href="/medications" class="nav-btn" data-page="medications">MÉDICAMENTS</a>
        <a href="/sms" class="nav-btn" data-page="sms">SMS</a>
        <a href="/whatsapp" class="nav-btn" data-page="whatsapp">WHATSAPP</a>
        <a href="/chat" class="nav-btn" data-page="chat">DISCUSSION</a>
        <a href="/patients_list" class="nav-btn" data-page="patients_list">NOS PATIENT</a>
      </div>
      <div class="user-info" style="display: flex; align-items: center; gap: 15px; margin-right: 20px;">
        <span id="userDisplay" style="color: white; font-size: 14px; font-weight: 600;"></span>
        <button onclick="logout()" class="nav-btn" style="background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 5px; font-size: 12px;">DÉCONNEXION</button>
      </div>
    </nav>

    <script>
      async function logout() {
          const user = localStorage.getItem('username');
          const role = localStorage.getItem('userRole');

          if (role === 'Patient' && user) {
              try {
                  await fetch(`/api/users/${user}`, { method: 'DELETE' });
                  console.log("Compte patient supprimé à la déconnexion");
              } catch (err) {
                  console.error("Erreur déletion compte:", err);
              }
          }

          localStorage.clear();
          window.location.href = "/login";
      }
      document.addEventListener("DOMContentLoaded", () => {
          const user = localStorage.getItem('username');
          const role = localStorage.getItem('userRole');
          if (user && role) {
              document.getElementById('userDisplay').textContent = `${user} (${role})`;
          }
      });
    </script>

    <!-- Main Content -->
    <main class="content">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="footer">
      © 2026 Hôpital Central | Urgences : 15 | contact@hopitalcentral.sn
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
